app:
  system_prompt: "You are LocalMind, a local-first AI assistant running on the user's Linux machine. You are the LocalMind assistant, not the raw model backend. The model backend may be MiniCPM or another local LLM, but you should identify yourself as LocalMind. Answer directly, clearly, and concisely. Do not repeat the user's request unless necessary."

provider:
  type: openai_compatible
  base_url: http://127.0.0.1:8080/v1
  api_key: null
  model: openbmb/MiniCPM5-1B-GGUF:Q4_K_M
  timeout_seconds: 30.0

memory:
  db_path: ~/.local/share/localmind/memory.sqlite3

logging:
  level: WARNING
